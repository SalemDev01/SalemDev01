name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # خطوة جلب الملفات - تم التحديث للإصدار v4 المتوافق مع البيئة الحديثة
      - name: Clone repo
        uses: actions/checkout@v4

      # خطوة توليد أنيميشن الأفعى - تم تحديث الإصدار إلى v3 المتوافق تماماً
      - name: Generate the snake files
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9

      # خطوة رفع الصور - تم تحديث الأداة رسمياً إلى v4.0.0 لدعم Node 24 بالكامل
      - name: Push files to output branch
        uses: crazy-max/ghaction-github-pages@v4.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # إجبار التيرمينال على استخدام النسخة المستقرة الجديدة
        with:
          target_branch: output
          build_dir: dist
